server {
    listen 80;
    server_name tl.digital-rsvp.co.zw 16.171.60.194;

    client_max_body_size 25M;

    location /static/ {
        alias /home/ubuntu/Digital-RSVP/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/Digital-RSVP/media/;
    }

    location / {
        proxy_pass http://unix:/run/wedding-invitation/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
